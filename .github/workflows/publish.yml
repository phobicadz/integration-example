name: Publish to Azure

# =============================================================================
# What this workflow does
#
#   build   -> dotnet publish the isolated Functions project (this doubles as the
#              compile gate: nothing reaches Azure that does not build)
#   deploy  -> OIDC login + Azure/functions-action -> "one deploy" to the existing
#              Flex Consumption function app (infra/ is provisioned separately by
#              infra/deploy.ps1; this workflow only publishes CODE)
#   verify  -> live smoke test against the deployed endpoints, including the
#              correlation-id round trip: send x-correlation-id, require it back in
#              the response header, in the 202 body, and in the finished run summary
#
# One-time setup (see README, "Publish from GitHub Actions"):
#   1. user-assigned managed identity + federated credential for this GitHub repo
#   2. RBAC role on the function app (Website Contributor) + Contributor on the RG
#   3. repository VARIABLES: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#      and FUNCTIONAPP_NAME (RESOURCE_GROUP is optional, only used for discovery)
# =============================================================================

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/smoke-test.sh'
      - '.github/workflows/publish.yml'
  workflow_dispatch:
    inputs:
      functionAppName:
        description: 'Optional: publish to a different function app name instead of the FUNCTIONAPP_NAME variable'
        required: false
        type: string

# id-token: write is what lets the runner exchange a GitHub OIDC token for an Azure token.
permissions:
  id-token: write
  contents: read

env:
  DOTNET_VERSION: '8.0.x'                 # must match <TargetFramework>net8.0</TargetFramework>
  PROJECT_PATH: 'src/ProductIntegration'  # where the .csproj lives
  BUILD_ARTIFACT: 'functionapp-package'
  DEPLOY_PACKAGE_DIR: 'deploy-package'

jobs:
  # ---------------------------------------------------------------------------
  build:
    name: Build the Functions package
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ env.PROJECT_PATH }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Framework-dependent publish: the app runs on the Linux Flex Consumption
      # runtime, so no RuntimeIdentifier is needed (same as the local publish).
      - name: dotnet publish
        run: dotnet publish ProductIntegration.csproj --configuration Release --output ./output

      - name: Upload deployment package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BUILD_ARTIFACT }}
          path: ${{ env.PROJECT_PATH }}/output
          include-hidden-files: true   # required for .NET build outputs
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  deploy:
    name: Publish to the function app
    runs-on: ubuntu-latest
    needs: build
    outputs:
      app_name: ${{ steps.resolve.outputs.app_name }}
      host: ${{ steps.host.outputs.host }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download deployment package
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.BUILD_ARTIFACT }}
          path: ${{ env.DEPLOY_PACKAGE_DIR }}

      # The workflow fails here with an actionable message instead of failing deep
      # inside azure/login with a confusing OIDC error.
      - name: Preflight — required repository variables
        shell: bash
        run: |
          missing=""
          for v in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            name="$v"
            if [ -z "${!name}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository variable(s):${missing} — set them under" \
                 "Settings → Secrets and variables → Actions → Variables." \
                 "Setup steps: README.md → 'Publish from GitHub Actions'."
            exit 1
          fi
          echo "Azure subscription: $AZURE_SUBSCRIPTION_ID"
          echo "Tenant:             $AZURE_TENANT_ID"

      - name: Log in to Azure (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          # Must match the single audience on the federated credential
          # (infra/setup-github-oidc.ps1). Stated explicitly rather than relying on
          # the action's default.
          audience: 'api://AzureADTokenExchange'

      # The function app name is generated by infra/main.bicep (baseName + random
      # suffix), so it is read from a repository variable; if that is not set we
      # discover the only function app inside the resource group.
      - name: Resolve target function app
        id: resolve
        shell: bash
        run: |
          app="${{ inputs.functionAppName }}"
          [ -z "$app" ] && app="${{ vars.FUNCTIONAPP_NAME }}"
          if [ -z "$app" ]; then
            rg="${{ vars.RESOURCE_GROUP }}"
            if [ -z "$rg" ]; then
              echo "::error::No FUNCTIONAPP_NAME variable and no RESOURCE_GROUP to discover it from." \
                   "Set FUNCTIONAPP_NAME (see infra/deployment-outputs.json after infra/deploy.ps1)."
              exit 1
            fi
            app=$(az resource list -g "$rg" --resource-type Microsoft.Web/sites \
                  --query "[?contains(kind,'functionapp')].name | [0]" -o tsv)
          fi
          if [ -z "$app" ]; then
            echo "::error::Could not determine a function app to publish to."
            exit 1
          fi
          echo "app_name=$app" >> "$GITHUB_OUTPUT"
          echo "Publishing to function app '$app'"

      # Flex Consumption: `sku` is only needed when authenticating with a publish
      # profile; with OIDC+RBAC the action resolves the plan itself.
      - name: Publish to Azure Functions
        uses: Azure/functions-action@v1
        id: deploy
        with:
          app-name: ${{ steps.resolve.outputs.app_name }}
          package: ${{ env.DEPLOY_PACKAGE_DIR }}

      # GITHUB_ENV is job-scoped, so the hostname is handed to the verify job as a
      # job output rather than an env var.
      - name: Record the app URL for the verify job
        id: host
        shell: bash
        run: |
          app="${{ steps.resolve.outputs.app_name }}"
          id=$(az resource list --resource-type Microsoft.Web/sites \
               --query "[?name=='$app'].id | [0]" -o tsv)
          host=""
          if [ -n "$id" ]; then
            host=$(az resource show --ids "$id" --query properties.defaultHostName -o tsv)
          fi
          # Fallback for locked-down subscriptions where the lookup is not permitted.
          [ -z "$host" ] && host="$app.azurewebsites.net"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          {
            echo "### Deployed"
            echo "- app: \`$app\`"
            echo "- url: https://$host"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  verify:
    name: Smoke test the live app
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run the end-to-end smoke test
        shell: bash
        run: |
          correlation="gha-${GITHUB_SHA::8}-$(date -u +%H%M%S)"
          echo "Correlation id for this run: $correlation"
          ./scripts/smoke-test.sh "https://${{ needs.deploy.outputs.host }}" "$correlation" \
            | tee "$GITHUB_STEP_SUMMARY"
